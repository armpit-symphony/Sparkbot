name: validate-public-shell

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  alignment-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Clone source-of-truth for release sync validation
        env:
          SOURCE_REPO: ${{ vars.SOURCE_OF_TRUTH_REPO || 'sparkpit-labs/Sparkbot' }}
        run: |
          git clone --depth 1 --branch public-release-final-cleanup-assessment "https://github.com/${SOURCE_REPO}" /tmp/source-of-truth

      - name: Run public alignment and sync checks
        run: |
          bash scripts/check-public-alignment.sh --source-repo /tmp/source-of-truth --source-ref public-release-final-cleanup-assessment

  backend:
    runs-on: ubuntu-latest
    needs:
      - alignment-and-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"

      - name: Run backend unit tests
        run: |
          pytest backend/tests -q

      - name: Run backend safety-policy and command-center tests
        run: |
          python -m compileall backend
          pytest backend/tests/test_command_center.py -q

  frontend:
    runs-on: ubuntu-latest
    needs:
      - alignment-and-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build frontend shell
        working-directory: frontend
        run: npm run build

  service-smoke:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start backend and run end-to-end safety smoke
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[dev]"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18000 --app-dir backend > /tmp/backend-service.log 2>&1 &
          SERVER_PID=$!

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          python - <<'PY'
import json
import urllib.error
import urllib.request

base = "http://127.0.0.1:18000"
resp = urllib.request.urlopen(f"{base}/health")
if resp.status != 200:
    raise SystemExit("health check failed")

payload = json.loads(urllib.request.urlopen(f"{base}/capabilities").read())
if not payload.get("service"):
    raise SystemExit("capabilities payload missing service")

req = urllib.request.Request(
    f"{base}/operator/command-center/actions",
    data=json.dumps(
        {
            "action_id": "smoke-check",
            "action_name": "end-to-end",
            "action_class": "terminal",
            "feature": "terminal",
            "operator_confirmation": False,
            "tenant_id": "tenant-smoke",
            "user_id": "user-smoke",
        }
    ).encode("utf-8"),
    headers={"Content-Type": "application/json"},
    method="POST",
)
resp = urllib.request.urlopen(req)
smoke = json.loads(resp.read())
if smoke.get("allowed"):
    raise SystemExit("safety policy smoke test expected blocked destructive action")

          PY

          kill "$SERVER_PID"

